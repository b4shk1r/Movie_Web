<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <a href="Shows.html"><button>TV Shows</button></a>
    <a href="Search.html"><button>Search</button></a>
</div>
<div class="page-layout">
    <div class="list">
        <h1>Trending</h1>
        <div class="pagination">
            <button id="prevPage">Previous</button>
            <button id="nextPage">Next</button>
        </div>
        <div class="elem-container" id="Trending"></div>
    </div>
    <div id="side">
        <div id="top"></div>
    </div>
</div>
<div id="movieModal" class="modal-overlay" hidden>
    <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content">
            <img class="modal-poster" id="modalPoster" src="" alt="">
            <div class="modal-info">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-genres" id="modalGenres"></div>
                <p class="modal-overview" id="modalOverview"></p>
            </div>
        </div>
    </div>
</div>
<script src="modal.js"></script>
<script src="Main.js"></script>
</body>
</html>
