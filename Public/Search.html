<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack — Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <a href="Shows.html"><button>TV Shows</button></a>
    <a href="Main.html"><button>Movies</button></a>
</div>
<div class="page-layout">
    <div class="list">
        <h1>Search Results</h1>
        <div class="search-controls">
            <input type="text" id="searchInput" placeholder="Search for a movie or TV show...">
            <button id="searchButton">Search</button>
            <div class="radio-group">
                <label><input type="radio" name="type" value="movie" checked> Movies</label>
                <label><input type="radio" name="type" value="tv"> TV Shows</label>
            </div>
        </div>
        <div class="genre-tags" id="genreTags"></div>
        <div class="pagination">
            <button id="prevPage">Previous</button>
            <button id="nextPage">Next</button>
        </div>
        <div class="elem-container" id="Results"></div>
    </div>
</div>
<div id="movieModal" class="modal-overlay" hidden>
    <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content">
            <img class="modal-poster" id="modalPoster" src="" alt="">
            <div class="modal-info">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-genres" id="modalGenres"></div>
                <p class="modal-overview" id="modalOverview"></p>
            </div>
        </div>
    </div>
</div>
<script src="modal.js"></script>
<script src="Search.js"></script>
</body>
</html>
